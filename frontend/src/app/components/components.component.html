<section class="hero rounded-5 p-4 p-md-5 mb-4">
  <div class="row align-items-center g-4">
    <div class="col-lg-7">
      <span class="badge rounded-pill text-bg-light text-dark fw-semibold mb-3">Now Booking</span>
      <h1 class="display-6 fw-bold text-white mb-3">Book your perfect cinema night</h1>
      <p class="lead text-white-50 mb-4">
        You want to watch the newest movie? Then you came to the right place. Gia Cinema is the one that you are looking for.
      </p>
      <button class="btn btn-light btn-lg rounded-pill px-4 fw-semibold">Find a movie</button>
    </div>
    <div class="col-lg-5">
      <div class="booking-panel rounded-5 p-4">
        <h2 class="h5 text-white mb-3">Quick Booking</h2>
        <div class="mb-3">
          <label class="form-label text-white-50">Movie</label>
          <select class="form-select rounded-4 bg-dark-subtle border-0">
            <option *ngFor="let movie of movies">{{ movie.title }}</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label text-white-50">Seats</label>
          <input class="form-control rounded-4 bg-dark-subtle border-0" type="number" min="1" value="2" />
        </div>
        <button class="btn btn-warning rounded-pill px-4 fw-semibold w-100">Reserve now</button>
      </div>
    </div>
  </div>
</section>

<section class="row g-4">
  <article class="col-md-6 col-xl-4" *ngFor="let movie of movies">
    <div class="movie-card rounded-5 p-4 h-100">
      <p class="text-uppercase small text-white-50 mb-2">{{ movie.hall }}</p>
      <h3 class="h5 text-white mb-2">{{ movie.title }}</h3>
      <p class="text-white-50 mb-3">Start: {{ movie.time }}</p>
      <div class="d-flex justify-content-between align-items-center">
        <span class="badge rounded-pill text-bg-light text-dark">{{ movie.seats }} seats left</span>
        <a href="#" class="btn btn-outline-light btn-sm rounded-pill px-3">Details</a>
      </div>
    </div>
  </article>
</section>
