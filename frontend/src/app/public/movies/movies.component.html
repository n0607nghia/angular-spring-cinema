<section class="rounded-5 p-4 p-md-5 movie-list-header mb-4 text-center">
  <h1 class="display-6 fw-bold text-white mb-2">Now Showing</h1>
  <p class="text-white-50 mb-0">Choose your movie and reserve seats in seconds.</p>
</section>

<section class="row g-4">
  <article class="col-md-6 col-xl-4" *ngFor="let screen of screening">
    <div class="movie-card rounded-5 p-4 h-100">
      <p class="text-uppercase small text-white-50 mb-2">{{ screen.image}}</p>
      <h2 class="h5 text-white mb-2">{{ screen.movieTitle }}</h2>
      <p class="text-white-50 mb-3">Start: {{ screen.screenTime }}</p>
      <div class="d-flex justify-content-between align-items-center">
        <span class="badge rounded-pill text-bg-light text-dark">{{ screen.seats }} seats left</span>
        <button class="btn btn-outline-light btn-sm rounded-pill px-3">Details</button>
      </div>
    </div>
  </article>
</section>
